# Git hooks managed by lefthook
# Install: brew install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    encrypt-public:
      run: OP_REF_FILE="$HOME/.claude/secrets-client-reports.op"; [ -f "$HOME/.claude/bin/load-secrets.sh" ] && . "$HOME/.claude/bin/load-secrets.sh"; python3 scripts/encrypt/encrypt_public.py --skip-unchanged && (git add $(find public -name '*.html') 2>/dev/null || true)
