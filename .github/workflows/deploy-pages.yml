name: Deploy public/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # Only public/ is uploaded. public-encrypted/ and everything else is never deployed.
      # include-hidden-files keeps public/.nojekyll, as v3 did (v4+ drops dotfiles by default).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  # Separate job so deploy-pages looks up the artifact after a job boundary
  # (same-job lookup races the artifacts API: actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
